erCompletedRows(): String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134" x="451.5" y="431.2363">+render(justAddedId)</text></g><!--entity Storage--><g id="elem_Storage"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229" x="45" y="516.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="92" x="113.5" y="541.1426">&#171;browser API&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79" x="55" y="558.752">localStorage</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209" x="55" y="576.3613">getItem(key) / setItem(key, value)</text></g><!--entity DOM--><g id="elem_DOM"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="164" x="891.5" y="516.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="92" x="927.5" y="541.1426">&#171;browser API&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="901.5" y="558.752">DOM / document</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144" x="901.5" y="576.3613">container, buttons, title</text></g><!--entity RowHelper--><g id="elem_RowHelper"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="239" x="529" y="516.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="95" x="601" y="541.1426">&#171;free function&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219" x="539" y="558.752">buildTaskRow(id, desc, completed,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203" x="539" y="576.3613">priority, createdAt, showActions)</text></g><!--entity SummaryHelper--><g id="elem_SummaryHelper"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="185" x="309" y="516.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="95" x="354" y="541.1426">&#171;free function&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="319" y="558.752">Workload summary helper</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133" x="319" y="576.3613">reads manager.tasks</text></g><!--entity Startup--><g id="elem_Startup"><rect fill="#F1F1F1" height="72.8281" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="286" x="633.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="114" x="719.5" y="70.1426">&#171;startup function&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180" x="643.5" y="87.752">DOMContentLoaded listener</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266" x="643.5" y="105.3613">constructs manager and binds Add / Enter</text></g><g id="elem_GMN15"><path d="M103,271.6094 L103,363.3672 A0,0 0 0 0 103,363.3672 L410,363.3672 A0,0 0 0 0 410,363.3672 L410,321.6094 L445.4,317.6094 L410,313.6094 L410,281.6094 L400,271.6094 L103,271.6094 A0,0 0 0 0 103,271.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M400,271.6094 L400,281.6094 L410,281.6094 L400,271.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220" x="109" y="290.1045">The only declared class in src/todo.js.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237" x="109" y="306.4561">All its properties and methods are public.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286" x="109" y="322.8076">It owns the tasks array and creates plain records:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229" x="109" y="339.1592">id, desc, completed, priority, createdAt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260" x="109" y="355.5107">There is no Task, TodoList, or Storage class.</text></g><g id="elem_GMN18"><path d="M6,650.6094 L6,693.3125 A0,0 0 0 0 6,693.3125 L313,693.3125 A0,0 0 0 0 313,693.3125 L313,660.6094 L303,650.6094 L163.5,650.6094 L159.5,589.8494 L155.5,650.6094 L6,650.6094 A0,0 0 0 0 6,650.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M303,650.6094 L303,660.6094 L313,660.6094 L303,650.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261" x="12" y="669.1045">Browser API dependency, not an owned part.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286" x="12" y="685.4561">Saved records survive destruction of the manager.</text></g><g id="elem_GMN21"><path d="M815.5,650.6094 L815.5,693.3125 A0,0 0 0 0 815.5,693.3125 L1131.5,693.3125 A0,0 0 0 0 1131.5,693.3125 L1131.5,660.6094 L1121.5,650.6094 L977.5,650.6094 L973.5,589.8494 L969.5,650.6094 L815.5,650.6094 A0,0 0 0 0 815.5,650.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1121.5,650.6094 L1121.5,660.6094 L1131.5,660.6094 L1121.5,650.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294" x="821.5" y="669.1045">Reference to an existing element, not composition.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295" x="821.5" y="685.4561">The page owns its lifetime; the manager updates it.</text></g><!--link TodoManager to Storage--><g id="link_TodoManager_Storage"><path codeLine="26" d="M445.49,429.7094 C439.57,432.9794 433.57,435.9694 427.5,438.6094 C376.61,460.7894 220.94,431.6694 179.5,468.6094 C166.15,480.5094 161.5509,493.6326 159.7609,510.5626 " fill="none" id="TodoManager-to-Storage" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="159.13,516.5294,164.0541,507.9998,159.6557,511.5571,156.0985,507.1587,159.13,516.5294" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124" x="180.5" y="483.1045">directly reads / writes</text></g><!--link TodoManager to DOM--><g id="link_TodoManager_DOM"><path codeLine="27" d="M693.73,390.4094 C766.09,432.2294 848.9553,480.1268 906.7053,513.5068 " fill="none" id="TodoManager-to-DOM" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="911.9,516.5094,906.1097,508.5424,907.5711,514.0072,902.1063,515.4686,911.9,516.5094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160" x="854.5" y="483.1045">keeps a container reference</text></g><!--link TodoManager to RowHelper--><g id="link_TodoManager_RowHelper"><path codeLine="28" d="M610.16,438.7794 C619.76,467.1594 627.346,489.5962 634.496,510.7162 " fill="none" id="TodoManager-to-RowHelper" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="636.42,516.3994,637.3228,506.592,634.8167,511.6634,629.7452,509.1573,636.42,516.3994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="625.5" y="483.1045">builds pending / completed rows</text></g><!--link TodoManager to SummaryHelper--><g id="link_TodoManager_SummaryHelper"><path codeLine="29" d="M485.96,438.7894 C474.48,454.9394 462.77,471.2294 451.5,486.6094 C444.31,496.4194 440.0301,502.1697 432.6501,511.8397 " fill="none" id="TodoManager-to-SummaryHelper" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="429.01,516.6094,437.6499,511.8817,432.0434,512.6347,431.2904,507.0282,429.01,516.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116" x="461.5" y="483.1045">requests status text</text></g><!--link SummaryHelper to TodoManager--><g id="link_SummaryHelper_TodoManager"><path codeLine="30" d="M334.58,516.4294 C316.79,502.3094 305.68,485.4394 318.5,468.6094 C348.95,428.6394 383.05,462.0394 427.5,438.6094 C433.5,435.4494 434.3628,435.1646 440.2728,431.4946 " fill="none" id="SummaryHelper-to-TodoManager" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="445.37,428.3294,435.6141,429.6791,441.1224,430.9671,439.8344,436.4754,445.37,428.3294" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="319.5" y="483.1045">inspects public tasks</text></g><!--link Startup to TodoManager--><g id="link_Startup_TodoManager"><path codeLine="31" d="M744.84,118.8294 C726.09,139.9694 705.1297,163.6192 679.9497,192.0292 " fill="none" id="Startup-to-TodoManager" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="675.97,196.5194,684.933,192.4372,679.2864,192.7775,678.9461,187.1309,675.97,196.5194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="san